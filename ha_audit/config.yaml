name: "HA Audit"
version: "0.8.16"
slug: "ha_audit"
description: "Read-only Home Assistant health, configuration and Core upgrade-readiness auditor"

arch:
  - amd64

startup: application
boot: manual_only
init: false

ingress: true
ingress_port: 8099
panel_icon: mdi:clipboard-text-search
panel_title: "HA Audit"

hassio_api: true
homeassistant_api: true
hassio_role: default

map:
  - type: addon_config
    read_only: false

  - type: homeassistant_config
    read_only: true

options: {}
schema: {}
