name: Readiness guidance test

on:
  workflow_dispatch:

  push:
    paths:
      - "ha_audit/readiness_guidance.py"
      - "ha_audit/test_readiness_guidance.py"
      - ".github/workflows/readiness-guidance-test.yml"

  pull_request:
    paths:
      - "ha_audit/readiness_guidance.py"
      - "ha_audit/test_readiness_guidance.py"
      - ".github/workflows/readiness-guidance-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run readiness guidance test
        run: python3 ha_audit/test_readiness_guidance.py
