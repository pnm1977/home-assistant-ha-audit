name: Summary output regression test

on:
  workflow_dispatch:

  push:
    paths:
      - "ha_audit/summary_report.py"
      - "ha_audit/summary_overview.py"
      - "ha_audit/summary_upgrade.py"
      - "ha_audit/readiness_guidance.py"
      - "ha_audit/health_guidance.py"
      - "ha_audit/test_summary_output.py"
      - ".github/workflows/summary-output-test.yml"

  pull_request:
    paths:
      - "ha_audit/summary_report.py"
      - "ha_audit/summary_overview.py"
      - "ha_audit/summary_upgrade.py"
      - "ha_audit/readiness_guidance.py"
      - "ha_audit/health_guidance.py"
      - "ha_audit/test_summary_output.py"
      - ".github/workflows/summary-output-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run summary output regression test
        run: python3 ha_audit/test_summary_output.py
