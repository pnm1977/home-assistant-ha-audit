name: AI evidence contract test

on:
  workflow_dispatch:

  push:
    paths:
      - "ha_audit/ai_evidence.py"
      - "ha_audit/test_ai_evidence.py"
      - "ha_audit/ai_handoff.py"
      - "ha_audit/test_ai_handoff.py"
      - ".github/workflows/ai-evidence-test.yml"

  pull_request:
    paths:
      - "ha_audit/ai_evidence.py"
      - "ha_audit/test_ai_evidence.py"
      - "ha_audit/ai_handoff.py"
      - "ha_audit/test_ai_handoff.py"
      - ".github/workflows/ai-evidence-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run AI evidence contract test
        run: python3 ha_audit/test_ai_evidence.py

      - name: Run readable AI handoff test
        run: python3 ha_audit/test_ai_handoff.py
