name: User summary test

on:
  workflow_dispatch:

  push:
    paths:
      - "ha_audit/user_summary.py"
      - "ha_audit/upgrade_decision.py"
      - "ha_audit/test_user_summary.py"
      - ".github/workflows/user-summary-test.yml"

  pull_request:
    paths:
      - "ha_audit/user_summary.py"
      - "ha_audit/upgrade_decision.py"
      - "ha_audit/test_user_summary.py"
      - ".github/workflows/user-summary-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run user summary test
        run: python3 ha_audit/test_user_summary.py
