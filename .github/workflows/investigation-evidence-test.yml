name: Investigation evidence regression tests

on:
  workflow_dispatch:

  push:
    paths:
      - "ha_audit/power_state_evidence.py"
      - "ha_audit/maintenance_window_evidence.py"
      - "ha_audit/investigation_handoff.py"
      - "ha_audit/web_ui.py"
      - "ha_audit/test_investigation_evidence.py"
      - "ha_audit/test_investigation_handoff.py"
      - "ha_audit/test_investigation_web_ui.py"
      - "ha_audit/test_report_freshness.py"
      - "ha_audit/core_2026_10_state_conditions.py"
      - "ha_audit/test_core_2026_10_state_conditions.py"
      - "ha_audit/core_compatibility_checks.py"
      - "ha_audit/core_compatibility_rules.py"
      - "ha_audit/test_core_compatibility_framework.py"
      - "ha_audit/run.sh"
      - ".github/workflows/investigation-evidence-test.yml"

  pull_request:
    paths:
      - "ha_audit/power_state_evidence.py"
      - "ha_audit/maintenance_window_evidence.py"
      - "ha_audit/investigation_handoff.py"
      - "ha_audit/web_ui.py"
      - "ha_audit/test_investigation_evidence.py"
      - "ha_audit/test_investigation_handoff.py"
      - "ha_audit/test_investigation_web_ui.py"
      - "ha_audit/test_report_freshness.py"
      - "ha_audit/core_2026_10_state_conditions.py"
      - "ha_audit/test_core_2026_10_state_conditions.py"
      - "ha_audit/core_compatibility_checks.py"
      - "ha_audit/core_compatibility_rules.py"
      - "ha_audit/test_core_compatibility_framework.py"
      - "ha_audit/run.sh"
      - ".github/workflows/investigation-evidence-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install state-condition scanner test dependency
        run: python3 -m pip install "PyYAML==6.0.3"

      - name: Run investigation evidence regression tests
        run: python3 ha_audit/test_investigation_evidence.py

      - name: Run investigation handoff regression tests
        run: python3 ha_audit/test_investigation_handoff.py

      - name: Run investigation Web UI regression tests
        run: python3 ha_audit/test_investigation_web_ui.py

      - name: Validate audit startup shell syntax
        run: bash -n ha_audit/run.sh

      - name: Run report freshness and failure-handling regression tests
        run: python3 ha_audit/test_report_freshness.py

      - name: Run Core 2026.10 state-condition regression tests
        run: python3 ha_audit/test_core_2026_10_state_conditions.py

      - name: Run generic Core compatibility framework regression tests
        run: python3 ha_audit/test_core_compatibility_framework.py
