name: Core log scan test

on:
  workflow_dispatch:

  push:
    paths:
      - "ha_audit/log_scan.py"
      - "ha_audit/test_log_scan.py"
      - ".github/workflows/log-scan-test.yml"

  pull_request:
    paths:
      - "ha_audit/log_scan.py"
      - "ha_audit/test_log_scan.py"
      - ".github/workflows/log-scan-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python3 -m pip install requests

      - name: Run Core log scan test
        run: python3 ha_audit/test_log_scan.py
