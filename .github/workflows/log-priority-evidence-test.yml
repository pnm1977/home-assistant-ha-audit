name: Log priority evidence test

on:
  workflow_dispatch:

  push:
    paths:
      - "ha_audit/log_priority_evidence.py"
      - "ha_audit/test_log_priority_evidence.py"
      - ".github/workflows/log-priority-evidence-test.yml"

  pull_request:
    paths:
      - "ha_audit/log_priority_evidence.py"
      - "ha_audit/test_log_priority_evidence.py"
      - ".github/workflows/log-priority-evidence-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run log priority evidence test
        run: python3 ha_audit/test_log_priority_evidence.py
