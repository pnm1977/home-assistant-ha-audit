name: Log family fallback test

on:
  workflow_dispatch:

  push:
    paths:
      - "ha_audit/log_family_scan.py"
      - "ha_audit/test_log_family_fallback_grouping.py"
      - ".github/workflows/log-family-fallback-test.yml"

  pull_request:
    paths:
      - "ha_audit/log_family_scan.py"
      - "ha_audit/test_log_family_fallback_grouping.py"
      - ".github/workflows/log-family-fallback-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run fallback grouping regression test
        run: python3 ha_audit/test_log_family_fallback_grouping.py
